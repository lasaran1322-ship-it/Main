<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Create Your Account</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="signup-container">
        <div class="signup-box">
            <div class="signup-header">
                <h1 class="signup-title">Create Account</h1>
                <p class="signup-subtitle">Join us today and get started</p>
            </div>

            <form class="signup-form" id="signupForm" novalidate>
                <!-- First Name -->
                <div class="form-group">
                    <label for="firstName" class="form-label">First Name *</label>
                    <input 
                        type="text" 
                        id="firstName" 
                        name="firstName" 
                        class="form-input" 
                        placeholder="John"
                        required
                    >
                    <span class="error-message" id="firstNameError"></span>
                </div>

                <!-- Last Name -->
                <div class="form-group">
                    <label for="lastName" class="form-label">Last Name *</label>
                    <input 
                        type="text" 
                        id="lastName" 
                        name="lastName" 
                        class="form-input" 
                        placeholder="Doe"
                        required
                    >
                    <span class="error-message" id="lastNameError"></span>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="form-label">Email Address *</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="you@example.com"
                        required
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="form-label">Password *</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Min 8 characters"
                            required
                        >
                        <button type="button" class="password-toggle" id="togglePassword">
                            <span class="toggle-icon">👁️</span>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password *</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            class="form-input" 
                            placeholder="Re-enter your password"
                            required
                        >
                        <button type="button" class="password-toggle" id="toggleConfirmPassword">
                            <span class="toggle-icon">👁️</span>
                        </button>
                    </div>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <!-- Terms & Conditions -->
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" id="terms" required>
                        <span>I agree to the <a href="#" class="link">Terms & Conditions</a> *</span>
                    </label>
                    <span class="error-message" id="termsError"></span>
                </div>

                <!-- Newsletter -->
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="newsletter" id="newsletter">
                        <span>Subscribe to our newsletter</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="signup-button" id="signupButton">
                    <span class="button-text">Create Account</span>
                    <span class="button-loader" id="buttonLoader"></span>
                </button>

                <!-- Success Message -->
                <div class="success-message" id="successMessage">
                    ✓ Account created successfully! Redirecting...
                </div>
            </form>

            <!-- Footer -->
            <div class="signup-footer">
                <p>Already have an account? <a href="login.html" class="login-link">Sign in here</a></p>
                <p class="privacy-link"><a href="#">Privacy Policy</a></p>
            </div>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
